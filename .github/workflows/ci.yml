name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: owl_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d owl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare integration database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d owl_test -c "CREATE ROLE owl_app LOGIN PASSWORD 'owl';"
          REMENTUM_DATABASE_ADMIN_URL=postgres://postgres:postgres@127.0.0.1:5432/owl_test pnpm db:migrate
      - run: pnpm check
        env:
          REMENTUM_TEST_DATABASE_URL: postgres://owl_app:owl@127.0.0.1:5432/owl_test
      - run: pnpm build
