name: Feature request
description: Suggest a capability or a change in behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does Rementum get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, and why they fall short.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This changes a versioned REST or MCP contract.
        - label: This needs a database migration.
        - label: I am willing to send a pull request.
