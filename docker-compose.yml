name: owl-memory

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OWL_DOMAIN: ${OWL_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_OWL_API_URL: ${OWL_PUBLIC_URL:-http://localhost}
    restart: unless-stopped
    environment:
      OWL_API_INTERNAL_URL: http://api:8787
      NEXT_PUBLIC_OWL_API_URL: ${OWL_PUBLIC_URL:-http://localhost}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    env_file: .env
    command: ["node", "packages/db/dist/migrate.js"]
    environment:
      OWL_DATABASE_ADMIN_URL: postgres://postgres:${OWL_POSTGRES_SUPER_PASSWORD:?set OWL_POSTGRES_SUPER_PASSWORD in .env}@postgres:5432/owl
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      OWL_DATABASE_URL: postgres://owl_app:${OWL_POSTGRES_PASSWORD:?set OWL_POSTGRES_PASSWORD in .env}@postgres:5432/owl
      OWL_EMBEDDINGS_URL: http://embeddings:8790
      OWL_BLOB_DIR: /data/blobs
      OWL_EXPORT_DIR: /data/exports
    volumes:
      - owl_data:/data
    depends_on:
      embeddings:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      OWL_DATABASE_URL: postgres://owl_app:${OWL_POSTGRES_PASSWORD:?set OWL_POSTGRES_PASSWORD in .env}@postgres:5432/owl
      OWL_EMBEDDINGS_URL: http://embeddings:8790
      OWL_BLOB_DIR: /data/blobs
      OWL_EXPORT_DIR: /data/exports
    volumes:
      - owl_data:/data
    depends_on:
      embeddings:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  embeddings:
    build:
      context: .
      dockerfile: apps/embeddings/Dockerfile
    restart: unless-stopped
    environment:
      OWL_EMBEDDING_MODEL: ${OWL_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      OWL_MODEL_CACHE: /models
    volumes:
      - model_cache:/models
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8790/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: owl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${OWL_POSTGRES_SUPER_PASSWORD:?set OWL_POSTGRES_SUPER_PASSWORD in .env}
      OWL_POSTGRES_PASSWORD: ${OWL_POSTGRES_PASSWORD:?set OWL_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${OWL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/00-app-role.sh:/docker-entrypoint-initdb.d/00-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d owl"]
      interval: 5s
      timeout: 5s
      retries: 20

  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    env_file: .env
    environment:
      OWL_DATABASE_ADMIN_URL: postgres://postgres:${OWL_POSTGRES_SUPER_PASSWORD:?set OWL_POSTGRES_SUPER_PASSWORD in .env}@postgres:5432/owl
      OWL_BLOB_DIR: /data/blobs
      OWL_BACKUP_DIR: /backups
    volumes:
      - owl_data:/data:ro
      - ${OWL_BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

  restore:
    profiles: ["restore"]
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    env_file: .env
    entrypoint: ["/usr/local/bin/owl-restore"]
    environment:
      OWL_DATABASE_ADMIN_URL: postgres://postgres:${OWL_POSTGRES_SUPER_PASSWORD:?set OWL_POSTGRES_SUPER_PASSWORD in .env}@postgres:5432/owl
      OWL_BLOB_DIR: /data/blobs
      OWL_BACKUP_AGE_IDENTITY_FILE: /run/secrets/age-identity
    volumes:
      - owl_data:/data
      - ${OWL_BACKUP_HOST_DIR:-./backups}:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  owl_data:
  model_cache:
