site_name: Owl Memory
site_description: Self-hosted, versioned memory for AI agents
repo_url: https://github.com/yibudak/owl-memory
repo_name: yibudak/owl-memory
edit_uri: edit/main/docs/
copyright: Copyright &copy; Owl Memory contributors

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Overview: index.md
  - Install: installation.md
  - Configure: configuration.md
  - Operate:
      - Backups and upgrades: operations.md
      - Security: security.md
  - Connect agents: integrations.md
  - Development: development.md
  - System flow: owl-memory-flow.html

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
