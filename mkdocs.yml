site_name: Rementum
site_description: Self-hosted, versioned memory for AI agents
site_url: https://rementum.dev/docs/
repo_url: https://github.com/rementum/rementum
repo_name: rementum/rementum
edit_uri: edit/main/docs/
copyright: Copyright &copy; Rementum contributors

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Overview: index.md
  - Install: installation.md
  - Configure: configuration.md
  - Operate:
      - Backups and upgrades: operations.md
      - Security: security.md
  - Connect agents: integrations.md
  - Architecture and FAQ: faq.md
  - Brand: brand.md
  - Development: development.md
  - System flow: rementum-flow.html

extra_css:
  - stylesheets/brand.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
